apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend-container
        image: backend-image
        imagePullPolicy: Never

        env:
        - name: APP_PORT
          value: "8000"

        ports:
        - containerPort: 8000

        volumeMounts:
        - mountPath: /app/backend/uploads
          name: storage-volume
          subPath: upload
        - mountPath: /app/backend/csv
          name: storage-volume
          subPath: csv

      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: backend-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: LoadBalancer